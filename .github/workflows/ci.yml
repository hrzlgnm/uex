name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: "🦀 Check (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  spdx:
    name: "📜 License headers"
    uses: hrzlgnm/actions/.github/workflows/spdx-reusable.yml@0d30078875c008b02cb2575ce5af3bd222ef2ee3 # v2.15.0
    with:
      runs-on: ubuntu-latest

  typos:
    name: "🔤 Typos"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: crate-ci/typos@b41eb62e9a8096c9ba6636e2365d3f56018a203c # master
